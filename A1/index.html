<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Pikachu · Electric Pokémon</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Nunito:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="page">
        <div class="left">
            <div class="type-badge">
                <span class="type-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <polyline points="12 2 12 7 12 7 15 10 12 13 9 10 12 7 12 7"></polyline>
                        <path d="M5 16 L7 12 L10 16 L12 13 L14 16 L17 12 L19 16"></path>
                        <path d="M12 22 L12 18"></path>
                    </svg>
                </span>
                ELECTRIC
            </div>
            <div class="gen-label">KANTO REGION</div>
            <h1 class="pokemon-name">PIKACHU</h1>
            <p class="pokemon-desc">
                When several of these Pokémon gather, their electricity can build and cause lightning storms.
                Pikachu stores electricity in the electric sacs on its cheeks.
            </p>
            <div class="counter">
                <div class="counter-line"></div>
                <div class="counter-text">025 <span>/ 151</span></div>
            </div>
            <div class="pokeball">
                <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="48" stroke="black" stroke-width="3" fill="white" />
                    <circle cx="50" cy="50" r="12" fill="black" />
                    <rect x="2" y="45" width="96" height="10" fill="black" />
                </svg>
            </div>
        </div>

        <div class="right">
          <img src="pikchu.png" />
            <div class="nav-dots">
                <div class="dot active"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>

        <div class="topbar">
            <div class="logo">
                <img src="logo.png" />
            </div>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </div>
</body>

</html>
